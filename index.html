<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3efdf" />
  <meta name="description" content="一个荒诞的赛博打工人生存模拟器。看看这破班你能上几天。" />
  <title>这破班你能上几天</title>
  <style>
    :root{--paper:#fff;--ink:#111;--acid:#fff400;--red:#ff3b21;--blue:#1748e8;--muted:#777}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    body{display:flex;justify-content:center}.app{position:relative;width:min(100%,520px);min-height:100dvh;background:var(--paper);overflow:hidden;padding:18px 18px max(24px,env(safe-area-inset-bottom))}
    .top{position:relative;display:flex;justify-content:space-between;align-items:center;font:800 13px/1.2 ui-monospace,monospace;letter-spacing:.04em}.stamp{padding:5px 8px;transform:rotate(-2deg);background:var(--acid)}
    .page{position:relative;z-index:1;display:none;min-height:calc(100dvh - 74px);flex-direction:column}.page.active{display:flex}.scribble{font-family:"Kaiti SC","STKaiti",serif;font-weight:900}
    h1{font-size:clamp(42px,13vw,68px);line-height:.94;letter-spacing:-.08em;margin:26px 0 8px;transform:rotate(-1deg);max-width:450px}h1 em{font-style:normal;background:linear-gradient(transparent 56%,var(--acid) 0)}
    .cross{position:relative;display:inline-block}.cross:after{content:"";position:absolute;left:-3px;right:-5px;top:53%;height:4px;background:var(--red);transform:rotate(-4deg)}
    .lede{margin:8px 0 10px;font-size:17px;line-height:1.65;max-width:420px}.hero{width:100%;max-height:310px;object-fit:contain;margin:0 auto 8px}
    button{font:900 17px/1.35 inherit;color:var(--ink);background:white;border:2.5px solid var(--ink);border-radius:8px;padding:14px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.primary{margin-top:auto;background:var(--acid);font-size:20px}.tiny{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0}
    .hud{margin:18px 0 16px}.progress{height:10px;background:#eee;transform:rotate(-.5deg)}.progress>i{display:block;height:100%;background:var(--acid);width:0;transition:width .25s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{padding:7px 5px;border-bottom:2px solid var(--ink);font-size:12px;text-align:center}.stat b{display:block;font-size:17px}.question{border:2.5px solid var(--ink);border-radius:8px;background:#fff;padding:20px 17px 16px;position:relative;transform:rotate(.25deg)}.question:before{content:"机密（已经群发）";position:absolute;right:10px;top:-11px;background:var(--red);color:white;padding:3px 7px;font-size:11px;font-weight:900;transform:rotate(4deg)}.scene{font-size:21px;line-height:1.55;font-weight:900;margin:4px 0}.note{font:800 14px/1.5 "Kaiti SC",serif;color:var(--blue);margin:10px 0 0;transform:rotate(-1deg)}
    .answers{display:grid;gap:11px;margin:18px 0}.answer{text-align:left;background:#fff;font-size:16px}.answer:nth-child(2n){transform:rotate(.35deg)}.answer:hover{background:var(--acid)}
    .feedback{position:fixed;z-index:9;left:50%;top:47%;width:min(calc(100% - 44px),460px);transform:translate(-50%,-50%) rotate(-1deg);background:var(--acid);border:3px solid var(--ink);box-shadow:6px 7px 0 var(--ink);padding:22px;display:none}.feedback.show{display:block;animation:pop .18s ease-out}.feedback h3{margin:0 0 10px;font-size:25px}.feedback p{font-size:17px;line-height:1.55;margin:0}.delta{display:inline-block;margin-top:12px;background:#fff;padding:5px 8px;font-weight:900}@keyframes pop{from{transform:translate(-50%,-45%) rotate(2deg) scale(.8);opacity:0}}
    .result-card{margin:18px 0;border:3px solid var(--ink);border-radius:9px;background:white;padding:18px;box-shadow:5px 6px 0 var(--ink);position:relative}.result-card:after{content:"内部泄露版";position:absolute;right:-5px;top:14px;background:var(--red);color:#fff;padding:4px 9px;font-weight:900;transform:rotate(6deg)}.result-kicker{font:900 13px ui-monospace,monospace}.result-name{font-size:42px;line-height:1.05;margin:13px 0 8px;letter-spacing:-.06em}.result-art{height:205px;margin:5px -4px 10px;overflow:hidden}.result-art svg{width:100%;height:100%;display:block}.result-copy{font-size:16px;line-height:1.65}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.result-grid div{border-bottom:2px solid var(--ink);padding:8px;font-size:13px}.result-grid b{display:block;font-size:19px;margin-top:3px}.quote{background:var(--acid);padding:8px 10px;font-weight:900;margin:11px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}.actions button{font-size:15px}.actions .wide{grid-column:1/-1;background:var(--acid)}
    .shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-4px) rotate(-1deg)}50%{transform:translateX(4px) rotate(1deg)}75%{transform:translateX(-2px)}}
    @media(max-height:720px){h1{font-size:46px;margin-top:17px}.hero{max-height:225px}.lede{font-size:15px}.scene{font-size:19px}}
  </style>
</head>
<body><main class="app" id="app">
  <div class="top"><span>EMPLOYEE.EXE</span><span class="stamp">试用期特供</span></div>
  <section class="page active" id="start">
    <h1 class="scribble">这<em>破班</em><br>你能上几天？</h1>
    <p class="lede">你入职了一家由 AI 管理、人类背锅、鹅负责决策的公司。坚持到年终奖到账——如果它真的存在。</p>
    <img class="hero" src="office-doodle.png" alt="潦草手绘的荒诞AI办公室" onerror="this.style.display='none'" />
    <button class="primary" id="startBtn">签署卖身契，立即入职 →</button>
    <p class="tiny">无需登录 · 工伤概不负责 · 约2分钟</p>
  </section>
  <section class="page" id="game">
    <div class="hud"><div class="progress"><i id="bar"></i></div><div class="stats"><div class="stat">理智<b id="sanity">50</b></div><div class="stat">权力<b id="power">20</b></div><div class="stat">良心<b id="soul">50</b></div></div></div>
    <div class="question" id="question"><div class="scene" id="scene"></div><div class="note" id="note"></div></div>
    <div class="answers" id="answers"></div>
  </section>
  <section class="page" id="result">
    <div class="result-card" id="capture"><div class="result-kicker">《碳基员工年度鉴定》</div><h2 class="result-name scribble" id="resultName"></h2><div class="result-art" id="resultArt"></div><div class="result-copy" id="resultCopy"></div><div class="result-grid"><div>存活时间<b id="days"></b></div><div>稀有度<b id="rarity"></b></div></div><div class="quote" id="quote"></div><small>※ 本报告由你的直属 AI 在 0.003 秒内草率生成</small></div>
    <div class="actions"><button id="saveBtn">保存结果图</button><button id="restartBtn">换个活法</button><button class="wide" id="shareBtn">叫同事一起受苦 →</button></div>
  </section>
  <aside class="feedback" id="feedback"><h3 id="fbTitle"></h3><p id="fbCopy"></p><span class="delta" id="fbDelta"></span></aside>
</main>
<script>
const events=[
 {s:'你躲进厕所摸鱼，刚坐下，老板在群里突然 @你：“在吗？有个小事。”',n:'你已经在隔间里屏住呼吸 3 分钟',a:[['秒回“在的”，假装正在工位',-7,3,-2,'老板紧接着打来视频。厕所回声出卖了你。'],['十分钟后回“刚在开会”',3,5,-3,'老板夸你忙，并给你加了一个会。'],['发一张厕所堵塞报修单',7,-2,5,'全公司开始关心你的身体，没人再问小事。']]},
 {s:'入职第一天，公司给你配了 8 个 AI 实习生。第二天，它们组建了一个没有你的工作群，并要求你汇报工作。',n:'群名叫「高效协同（不含人类）」',a:[['连夜做PPT证明自己是人类',-8,3,-2,'PPT第47页出现了验证码。你证明失败。'],['混进群里只发“收到”',2,5,-4,'AI们误以为你是高层，开始抄送你。'],['拔掉服务器宣布全员放假',8,-5,6,'公司第一次准时下班。打印机为你鼓掌。']]},
 {s:'你下楼买奶茶，被同事抓到后变成了全组跑腿。18 杯奶茶刚送到，老板正好走进办公室。',n:'其中 6 杯写着“三分糖但要快乐”',a:[['说这是客户招待',-3,6,-5,'老板拿走最大杯，并让你报销时写清客户姓名。'],['当场组织奶茶品鉴会',4,4,-2,'大家一致通过：这是本季度最有产出的会议。'],['只拿自己的，其他装不认识',7,-5,3,'同事记住了这一天，你保住了吸管。']]},
 {s:'AI 替你写了周报，但虚构了三个你没有做过的项目。老板非常满意，决定让你下周全部交付。',n:'其中一个项目叫「赋能赋能本身」',a:[['承认是AI编的',3,-4,8,'老板表扬你诚实，然后把AI升成了你的领导。'],['再让AI生成项目代码',-4,7,-5,'代码跑通了。没人知道它解决什么问题。'],['把项目包装成战略预研',1,10,-8,'预算到账。你的良心进入维护模式。']]},
 {s:'周五下午，公司宣布周六早上 6 点团建爬山，主题是“自愿凝聚力”。',n:'行政强调：不强制，但会拍集体照',a:[['凌晨五点起床参加',-10,4,4,'你在山顶获得一枚写着“热爱工作”的塑料奖牌。'],['假装周末手机坏了',7,-4,2,'周一发现合照里有人把你的头像P了上去。'],['建议改成线上云爬山',4,8,-3,'全员在群里发旧照片，你被任命为团建创新负责人。']]},
 {s:'办公室突然闯进一只鹅，吃掉了你的电脑线。由于执行力高于部门平均值，它被任命为项目负责人。',n:'鹅要求所有需求必须“嘎”三次确认',a:[['服从鹅的管理',4,2,-3,'你的绩效上升了。鹅说你很有禽商。'],['挑战鹅的专业能力',-8,-6,5,'鹅展示了三年管理经验和一页PPT，你败了。'],['给鹅安排一个AI副手',2,8,-4,'它们在十分钟内完成权力交接，把你移出群聊。']]},
 {s:'你已经穿好外套准备下班，领导头像亮起：“在吗？不急，今天给我就行。”',n:'现在是 18:29，打卡机离你 12 米',a:[['脱下外套继续干',-9,3,4,'你完成了任务，也错过了最后一班不堵车的地铁。'],['边走边回“明早第一版”',5,2,2,'领导回了“OK”，世界居然没有毁灭。'],['假装没看见直接消失',8,-3,-1,'你成为群里最后一个已读却最先到家的人。']]},
 {s:'领导宣布取消无效会议。随后创建了一个两小时会议，讨论哪些会议属于无效会议。',n:'参会人：全员、全员的 Agent、鹅',a:[['认真整理会议纪要',-8,2,3,'你的纪要触发了新的纪要评审会。'],['让数字分身替你参会',6,4,-3,'分身获得了发言权，你获得了安静。'],['全程假装网络卡顿',4,-4,1,'你定格的表情被选为公司文化海报。']]}
];
const results=[
 {test:x=>x.power>=55,n:'办公室隐形股东',r:'7.1%',q:'你不一定有股份，但所有人做事前都想问问你。',c:'你会拉领导下水、把团建改线上、让一杯奶茶变成预算。没人知道你具体管什么，但你一请假，群里就会失去方向。',icon:'👑',tag:'别问，问就是在推进'},
 {test:x=>x.sanity>=75,n:'带薪失踪人口',r:'4.8%',q:'头像一直在线，肉身偶尔失联。',c:'你掌握了打工的最高奥义：消息可以回，工位不必坐。厕所、奶茶店和回家路上，处处都是你的移动办公区。',icon:'👻',tag:'人不在，收到永远在'},
 {test:x=>x.soul>=70,n:'下班守门员',r:'3.6%',q:'只要你跑得够快，加班就追不上你。',c:'你保住了同事、饭点和周末，也成功证明很多“今天必须完成”的事，第二天再做公司依然没有倒闭。',icon:'🚪',tag:'18:30 后概不负责'},
 {test:x=>x.power<=10,n:'工位地缚灵',r:'14.2%',q:'部门换了三任领导，你和绿萝还在原位。',c:'你见证了口号、组织架构和年会节目轮番变化，依然稳稳坐在工位。大家以为你忠诚，其实你只是懒得收拾抽屉。',icon:'🪴',tag:'别动我，我和椅子长一起了'},
 {test:x=>x.soul<=20,n:'熟练甩锅运动员',r:'8.9%',q:'锅不会消失，只会精准落到别人桌上。',c:'你能把摸鱼说成调研，把奶茶说成客户接待，把失联说成外出办公。你的工作能力未知，求生能力已通过认证。',icon:'🍳',tag:'这个事情要不再拉个人？'},
 {test:x=>x.sanity<=20,n:'情绪稳定异常者',r:'9.7%',q:'不是脾气好，是灵魂暂时没加载出来。',c:'面对临时会议、周末团建和下班前的“在吗”，你始终露出祥和微笑。领导认为你抗压，同事怀疑你已经关机。',icon:'🙂',tag:'好的收到马上看'},
 {test:x=>x.power>=35&&x.soul>=45,n:'人形万能转接头',r:'11.3%',q:'什么都不归你，但最后什么都来找你。',c:'你能接老板的话、同事的奶茶和行政的团建通知。你不是管理者，也不是执行者，你是公司唯一支持自然语言的客服入口。',icon:'🔌',tag:'这事我先帮你问问'},
 {test:x=>true,n:'碳基已读回执',r:'18.6%',q:'输入一句“在吗”，输出一整天免费劳动。',c:'你响应稳定、兼容性强，还会主动补一句“需要我现在看吗”。唯一的问题是公司一直忘记给你充值，却不断提高调用频率。',icon:'💬',tag:'收到收到收到'}
];
let state={i:0,sanity:50,power:20,soul:50,log:[]};
const $=id=>document.getElementById(id); const pages=['start','game','result'];
function show(id){pages.forEach(p=>$(p).classList.toggle('active',p===id));scrollTo(0,0)}
function render(){const e=events[state.i];$('bar').style.width=(state.i/events.length*100)+'%';$('sanity').textContent=state.sanity;$('power').textContent=state.power;$('soul').textContent=state.soul;$('scene').textContent=e.s;$('note').textContent='↳ '+e.n;$('answers').innerHTML='';e.a.forEach((a,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+a[0];b.onclick=()=>choose(a);$('answers').appendChild(b)})}
function choose(a){state.sanity=Math.max(0,Math.min(100,state.sanity+a[1]));state.power=Math.max(0,Math.min(100,state.power+a[2]));state.soul=Math.max(0,Math.min(100,state.soul+a[3]));state.log.push(a[0]);$('fbTitle').textContent=['组织已学习','问题已扩大','你的选择很有勇气'][Math.floor(Math.random()*3)];$('fbCopy').textContent=a[4];$('fbDelta').textContent=`理智 ${a[1]>=0?'+':''}${a[1]}　权力 ${a[2]>=0?'+':''}${a[2]}　良心 ${a[3]>=0?'+':''}${a[3]}`;$('feedback').classList.add('show');setTimeout(()=>{$('feedback').classList.remove('show');state.i++;state.i<events.length?render():finish()},2000)}
let currentResult=null;
function resultDoodle(r){return `<svg viewBox="0 0 420 205" role="img" aria-label="${r.n}的潦草鉴定插图"><path d="M18 180 Q105 171 202 182 T401 176" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="210" cy="102" r="82" fill="#fff400"/><text x="315" y="67" font-size="48" transform="rotate(8 315 67)">${r.icon}</text><path d="M169 69 Q180 42 199 61 Q222 42 245 69 L241 117 Q207 137 172 116 Z" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/><path d="M174 72 Q151 63 156 91 M240 72 Q263 61 258 92" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="190" cy="91" r="3.5" fill="#111"/><circle cx="222" cy="91" r="3.5" fill="#111"/><path d="M202 105 Q209 111 216 104" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M190 126 Q182 150 181 175 M225 126 Q237 150 234 175 M184 144 Q155 151 143 135 M232 145 Q257 150 275 134" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M169 176 l-18 5 M234 176 l18 4" stroke="#111" stroke-width="6" stroke-linecap="round"/><rect x="22" y="21" width="156" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="3" transform="rotate(-3 22 21)"/><text x="100" y="44" text-anchor="middle" font-size="15" font-weight="900" font-family="sans-serif">${r.tag}</text><path d="M278 120 q35 -18 70 4 M300 145 q28 -12 57 3" stroke="#1748e8" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`}
function finish(){const r=results.find(x=>x.test(state));currentResult=r;const days=Math.max(3,Math.round((state.sanity+state.power+state.soul)*6.7));$('resultName').textContent=r.n;$('resultArt').innerHTML=resultDoodle(r);$('resultCopy').textContent=r.c;$('rarity').textContent=r.r;$('days').textContent=days>365?`${Math.floor(days/365)}年${days%365}天`:`${days}天`;$('quote').textContent=r.q;show('result')}
function reset(){state={i:0,sanity:50,power:20,soul:50,log:[]};render();show('game')}
$('startBtn').onclick=reset;$('restartBtn').onclick=reset;
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){let line='',lines=[];for(const ch of text){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight))}
async function makePoster(){const r=currentResult,c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff400';x.fillRect(0,0,1080,36);x.strokeStyle='#111';x.lineWidth=8;x.strokeRect(56,58,968,1230);x.fillStyle='#111';x.font='900 30px sans-serif';x.fillText('《碳基员工年度鉴定》',92,118);x.fillStyle='#ff3b21';x.fillRect(765,78,190,50);x.fillStyle='#fff';x.font='900 24px sans-serif';x.fillText('内部泄露版',790,112);x.fillStyle='#111';x.font='900 92px sans-serif';x.fillText(r.n,90,245);x.fillStyle='#fff400';x.beginPath();x.arc(540,480,185,0,Math.PI*2);x.fill();x.strokeStyle='#111';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(455,410);x.quadraticCurveTo(480,340,520,390);x.quadraticCurveTo(570,340,620,410);x.lineTo(610,520);x.quadraticCurveTo(540,565,465,520);x.closePath();x.fillStyle='#fff';x.fill();x.stroke();x.beginPath();x.moveTo(465,412);x.quadraticCurveTo(405,390,420,455);x.moveTo(608,412);x.quadraticCurveTo(675,388,660,455);x.stroke();x.fillStyle='#111';x.beginPath();x.arc(510,455,8,0,7);x.arc(565,455,8,0,7);x.fill();x.beginPath();x.moveTo(525,490);x.quadraticCurveTo(540,507,557,489);x.stroke();x.font='100px sans-serif';x.fillText(r.icon,730,500);x.fillStyle='#111';x.font='900 34px sans-serif';x.textAlign='center';x.fillText(r.tag,540,710);x.textAlign='left';x.fillStyle='#fff400';x.fillRect(85,755,910,95);x.fillStyle='#111';x.font='900 32px sans-serif';wrap(x,r.q,115,815,850,42,2);x.font='28px sans-serif';wrap(x,r.c,100,920,880,44,4);x.font='900 26px sans-serif';x.fillText(`存活时间：${$('days').textContent}`,100,1135);x.fillText(`稀有度：${r.r}`,610,1135);x.font='24px sans-serif';x.fillStyle='#777';x.fillText('这破班你能上几天？',100,1225);x.fillText('wenyu0608.github.io/zhe-b-ban',545,1225);return c}
$('saveBtn').onclick=async()=>{const c=await makePoster();c.toBlob(async blob=>{const file=new File([blob],'这破班工作鉴定.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'我的工作鉴定'});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);$('saveBtn').textContent='结果图已生成'},'image/png')};
